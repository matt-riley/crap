[package]
name = "crap-cli"
version = "0.1.3"
edition = "2024"
description = "Token-aware Change Risk Anti-Patterns (CRAP) scoring for TypeScript, Rust, Go and Lua"
license = "MIT"

[[bin]]
name = "crap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
lto = true
strip = true
