name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:linux
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@199a821df4bedf61b1bcb813fd33eb334a041987
    with:
      fmt: true
      lint: true
      test: true
      build: true

  macos:
    name: macOS
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:macos
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@199a821df4bedf61b1bcb813fd33eb334a041987
    with:
      runner: macos-latest
      test: true
