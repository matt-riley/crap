name: Release

# Release Please opens a release PR from conventional commits. When that PR
# merges, this same run builds the binaries, publishes the release and updates
# the Homebrew tap — no tag-triggered workflow, so a release created with
# GITHUB_TOKEN still reaches the tap.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight run: a half-published release is worse than a
  # queued one.
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@cb986078a5bd4775e5fb05348f3618e41fedf4de # v4.0.0
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      # Without a token of its own, release-please tags via GITHUB_TOKEN. That
      # is fine here because everything downstream runs in this same run.
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          # An Apple Silicon runner builds both darwin targets; the macOS SDK
          # ships both architectures, so no extra toolchain is needed.
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: darwin
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: darwin
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: crap_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${TARGET}/release/crap" dist/crap
          # COPYFILE_DISABLE stops BSD tar storing AppleDouble metadata, which
          # would otherwise land a stray ._crap beside the binary on Linux.
          COPYFILE_DISABLE=1 tar -czf "dist/${ARCHIVE}" -C dist crap
          tar -tzf "dist/${ARCHIVE}"
          ls -l "dist/${ARCHIVE}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crap-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: crap-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      # Release Please leaves a draft release, so the assets land before the
      # Homebrew formula starts pointing at them.
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              --draft
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  homebrew:
    name: Homebrew tap
    needs: [release-please, publish]
    permissions:
      contents: read
    # Needs the commit that taught homebrew-formula.yml to mint from a GitHub
    # App (e587109); that lets the tap run on a short-lived installation token
    # scoped to one repository instead of a long-lived PAT.
    uses: matt-riley/matt-riley-ci/.github/workflows/homebrew-formula.yml@e587109a12a93cb77ddf41d5a20879dd9bffc50e
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      formula-name: crap
      class-name: Crap
      desc: Change Risk Anti-Patterns (CRAP) scoring for TypeScript, Rust, Go and Lua
      homepage: https://github.com/matt-riley/crap
      license: MIT
      binary: crap
      archive-x86_64-macos: crap_darwin_amd64.tar.gz
      archive-aarch64-macos: crap_darwin_arm64.tar.gz
      archive-x86_64-linux: crap_linux_amd64.tar.gz
      archive-aarch64-linux: crap_linux_arm64.tar.gz
      # APP_ID is the tap App, the same one the GoReleaser repos use.
      tap-app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.PRIVATE_KEY }}
      # Used only when the App is unconfigured or its mint failed.
      homebrew-tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.TAP_TOKEN }}
