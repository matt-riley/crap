[tools]
# GH runners default rustup to the minimal profile, which has no rustfmt or
# clippy, so `mise run fmt`/`lint` fail there while passing locally. Ask for
# the components explicitly so the toolchain is the same everywhere. The
# self-scan needs llvm-tools for `cargo llvm-cov`.
rust = { version = "1.99", components = ["rustfmt", "clippy", "llvm-tools-preview"] }
actionlint = "1.7.12"

[tasks.install]
description = "Fetch dependencies"
run = "cargo fetch --locked"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Lint"
depends = ["install"]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Test"
depends = ["install"]
run = "cargo test --locked"

[tasks.build]
description = "Build the release binary"
depends = ["install"]
run = "cargo build --release --locked"

[tasks.coverage]
description = "Generate an LCOV report of the test suite"
depends = ["install"]
run = "cargo llvm-cov --lcov --output-path lcov.info --quiet"

[tasks.self-scan]
description = "Score crap against its own source, with real coverage"
depends = ["coverage", "build"]
run = "target/release/crap src --coverage lcov.info --fail-above"

[tasks.ci]
description = "Everything CI runs"
depends = ["fmt", "lint", "test", "build", "self-scan"]
